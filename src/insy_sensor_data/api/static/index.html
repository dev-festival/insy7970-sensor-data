<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>INSY Sensor Data</title>
    <link rel="stylesheet" href="/static/styles.css">
    <script src="/static/charts.js" defer></script>
    <script type="module" src="/static/app.js"></script>
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Sensor Review</p>
          <h1 id="app-title">INSY Sensor Data</h1>
        </div>
        <div class="service-status" aria-live="polite">
          <p id="health-status" class="health-status">Checking service health...</p>
          <p id="sync-status" class="sync-status">Checking data synchronization...</p>
        </div>
      </header>

      <section class="global-context" aria-label="Global context">
        <label>
          <span>Start</span>
          <select id="start-date-select"></select>
        </label>
        <label>
          <span>End</span>
          <select id="end-date-select"></select>
        </label>
        <button id="refresh-button" type="button">Refresh</button>
      </section>

      <div class="review-layout">
        <aside class="navigator" aria-label="Equipment and sensor navigation">
          <div class="navigator-header">
            <label>
              <span>Equipment Search</span>
              <input id="equipment-search" type="search" autocomplete="off">
            </label>
            <button id="all-equipment-button" class="scope-button is-active" type="button">All Equipment</button>
          </div>
          <p id="scope-status" class="scope-status">All equipment selected</p>
          <div id="equipment-tree" class="equipment-tree" role="tree"></div>
        </aside>

        <section class="review-main" aria-label="Review workspace">
          <nav class="tabs" aria-label="Views" role="tablist">
            <button id="review-tab" class="tab is-active" type="button" role="tab" aria-selected="true" data-view="review">Review</button>
            <button id="trends-tab" class="tab" type="button" role="tab" aria-selected="false" data-view="trends">Fleet Trends</button>
            <button id="cluster-tab" class="tab" type="button" role="tab" aria-selected="false" data-view="cluster">Cluster</button>
            <button id="drift-tab" class="tab" type="button" role="tab" aria-selected="false" data-view="drift">Drift</button>
          </nav>

          <div id="view-pinned" class="view-pinned">
            <header id="snapshot-context" class="snapshot-context" hidden></header>

            <section class="view-controls" aria-label="View controls">
              <label id="date-control">
                <span>Date</span>
                <select id="date-select"></select>
              </label>
              <label id="metric-control">
                <span class="metric-label-row">
                  <span>Metric</span>
                  <output id="metric-coverage" class="metric-coverage" hidden></output>
                </span>
                <select id="metric-select"></select>
              </label>
              <label id="dimension-control">
                <span>Dimension</span>
                <select id="dimension-select"></select>
              </label>
            </section>
          </div>

          <p id="status-line" class="status-line" aria-live="polite">Loading context...</p>

          <section id="snapshot-review" class="snapshot-review" aria-label="Snapshot review" hidden>
            <div id="snapshot-scroll" class="snapshot-scroll">
              <div class="snapshot-chart-grid" aria-label="Snapshot charts">
                <section class="snapshot-panel snapshot-chart-panel" aria-label="Trend context">
                  <div class="snapshot-panel-heading">
                    <h2>Trend Context</h2>
                    <p id="snapshot-trend-status"></p>
                  </div>
                  <div id="snapshot-trend-chart" class="snapshot-chart" role="img" aria-label="Snapshot trend chart"></div>
                </section>

                <section class="snapshot-panel snapshot-chart-panel" aria-label="Cluster context">
                  <div class="snapshot-panel-heading">
                    <h2>Cluster Context</h2>
                    <p id="snapshot-cluster-status"></p>
                  </div>
                  <div id="snapshot-cluster-chart" class="snapshot-chart" role="img" aria-label="Snapshot cluster chart"></div>
                </section>
              </div>

              <div class="snapshot-details" aria-label="Snapshot detail tables">
                <details id="snapshot-events-detail" class="snapshot-detail">
                  <summary>
                    <span class="snapshot-detail-title">Events</span>
                    <span id="snapshot-events-status"></span>
                  </summary>
                  <div class="snapshot-table-shell">
                    <table>
                      <thead id="snapshot-events-head"></thead>
                      <tbody id="snapshot-events-body"></tbody>
                    </table>
                  </div>
                </details>

                <details id="snapshot-measurements-detail" class="snapshot-detail">
                  <summary>
                    <span class="snapshot-detail-title">Measurements</span>
                    <span id="snapshot-measurements-status"></span>
                  </summary>
                  <div class="snapshot-table-shell">
                    <table>
                      <thead id="snapshot-measurements-head"></thead>
                      <tbody id="snapshot-measurements-body"></tbody>
                    </table>
                  </div>
                  <section class="snapshot-diagnostics" aria-labelledby="snapshot-diagnostics-heading">
                    <h3 id="snapshot-diagnostics-heading">Snapshot Diagnostics</h3>
                    <div class="snapshot-table-shell snapshot-diagnostics-table-shell">
                      <table>
                        <thead id="snapshot-diagnostics-head"></thead>
                        <tbody id="snapshot-diagnostics-body"></tbody>
                      </table>
                    </div>
                  </section>
                </details>
              </div>
            </div>
          </section>

          <section id="summary-grid" class="summary-grid" aria-label="Summary"></section>

          <section id="workspace" class="workspace">
            <div id="plot" class="plot" role="img" aria-label="Current view chart"></div>
          </section>

          <section id="table-shell" class="table-shell" aria-label="Data table">
            <table>
              <thead id="data-table-head"></thead>
              <tbody id="data-table-body"></tbody>
            </table>
          </section>
        </section>
      </div>
    </main>
  </body>
</html>
