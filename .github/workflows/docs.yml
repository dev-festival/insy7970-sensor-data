name: Docs

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v8.1.0

      - uses: actions/configure-pages@v5

      - run: uv sync --locked

      - name: Build API documentation
        run: uv run pdoc -o docs/api insy_sensor_data
        env:
          PYTHONPATH: src

      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs/api

  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4